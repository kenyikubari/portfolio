[[project]]
title = "Capstone: Rear Service Door Design (MCI)"
description = """
Developed a systematic door design process for Motor Coach Industries addressing water intrusion, latching, and binding issues. Final design used Carbon Fiber Epoxy and 6061-T6 Aluminum with truss geometry — 80% reduction in max stress and 21.53 mm less displacement under three-point bending."""
