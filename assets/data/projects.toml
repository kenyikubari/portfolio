[[project]]
title = "Bachelor's Thesis: Streamwise Aspect Ratios & Flow Separation"
description = """
Experimental study examining the effects of streamwise aspect ratio on flow \
separation of trapezoidal prisms using particle image velocimetry (PIV). \
Analyzed six aspect ratio cases to investigate mean flow characteristics, \
Reynolds stresses, and turbulent kinetic energy distributions."""
